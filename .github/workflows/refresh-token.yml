name: Refresh Instagram token

on:
  schedule:
    - cron: "17 3 1,15 * *"        # 1st and 15th of every month (token lasts 60 days)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh-token.yml"]   # test refresh when this file changes

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and store the new token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841450608939000' }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          set +e
          NEW=$(python autopost.py refresh-token); code=$?
          set -e
          if [ $code -eq 3 ]; then echo "::warning::Add FB_APP_ID and FB_APP_SECRET secrets to enable auto-refresh"; exit 0; fi
          if [ $code -ne 0 ] || [ -z "$NEW" ]; then exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Token refreshed and saved."
