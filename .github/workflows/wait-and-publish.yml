name: Wait and publish on time

# GitHub's 30-minute timer can be hours late on quiet repos.
# Whenever a post is queued, this run waits until its exact publish time
# (up to ~23 h ahead, in chained 5h50m steps) and then publishes it.

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  STEP_MAX: "21000"                  # 5h50m: a single job may run at most 6 h

jobs:
  wait1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Wait for the next post
        run: |
          W=$(python autopost.py next-wait)
          echo "seconds until next post: $W"
          if [ "$W" -gt 0 ]; then S=$(( W < STEP_MAX ? W : STEP_MAX )); echo "sleeping $S s"; sleep "$S"; fi
  wait2:
    needs: wait1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Wait for the next post
        run: |
          W=$(python autopost.py next-wait)
          echo "seconds until next post: $W"
          if [ "$W" -gt 0 ]; then S=$(( W < STEP_MAX ? W : STEP_MAX )); echo "sleeping $S s"; sleep "$S"; fi
  wait3:
    needs: wait2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Wait for the next post
        run: |
          W=$(python autopost.py next-wait)
          echo "seconds until next post: $W"
          if [ "$W" -gt 0 ]; then S=$(( W < STEP_MAX ? W : STEP_MAX )); echo "sleeping $S s"; sleep "$S"; fi
  wait4:
    needs: wait3
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Wait for the next post
        run: |
          W=$(python autopost.py next-wait)
          echo "seconds until next post: $W"
          if [ "$W" -gt 0 ]; then S=$(( W < STEP_MAX ? W : STEP_MAX )); echo "sleeping $S s"; sleep "$S"; fi

  publish:
    needs: wait4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: autopost                # shared with the scheduled workflow: never two publishes at once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Image links point at this exact commit
        run: echo "IMAGE_BASE_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841450608939000' }}
        run: python autopost.py check && python autopost.py publish
      - name: Save publish log
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "byteverse-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add published.json
            git commit -m "Log published post"
            git pull --rebase origin main && git push
          fi
